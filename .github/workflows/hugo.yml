name: Build and Deploy Hugo Site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        run: hugo --minify --buildFuture --baseURL "https://glimerz.com/"

      - name: Optimize homepage images as high-quality WebP
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          images = {
              "kitchen-gen.png": "kitchen-gen.webp",
              "AI-piro4d.jpg": "AI-piro4d.webp",
          }
          image_dir = Path("public/images")
          for source_name, output_name in images.items():
              source = image_dir / source_name
              output = image_dir / output_name
              with Image.open(source) as image:
                  image.save(output, "WEBP", quality=94, method=6)
              print(f"{source.name}: {source.stat().st_size:,} bytes -> {output.name}: {output.stat().st_size:,} bytes")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
