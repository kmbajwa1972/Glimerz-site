name: Build and Deploy Hugo Site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        run: hugo --minify --buildFuture --baseURL "https://glimerz.com/"

      - name: Optimize homepage images for web
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          # Keep original assets untouched; generate appropriately sized homepage copies.
          images = {
              "home-03.jpg": ("home-03-optimized.webp", 1200, 88),
              "home-living.jpg": ("home-living-optimized.webp", 900, 88),
              "kitchen-gen.png": ("kitchen-gen-optimized.webp", 900, 88),
              "AI-piro4d.jpg": ("AI-piro4d-optimized.webp", 900, 88),
              "home-05.jpg": ("home-05-optimized.webp", 1100, 88),
          }
          image_dir = Path("public/images")
          for source_name, (output_name, max_width, quality) in images.items():
              source = image_dir / source_name
              output = image_dir / output_name
              with Image.open(source) as image:
                  image = image.convert("RGB")
                  if image.width > max_width:
                      height = round(image.height * max_width / image.width)
                      image = image.resize((max_width, height), Image.Resampling.LANCZOS)
                  image.save(output, "WEBP", quality=quality, method=6)
              print(f"{source.name}: {source.stat().st_size:,} bytes -> {output.name}: {output.stat().st_size:,} bytes ({image.width}x{image.height})")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
