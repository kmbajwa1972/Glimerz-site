name: Glimerz Automatic YouTube Builder

on:
  push:
    paths:
      - "content/blog/*.md"
  workflow_dispatch:
    inputs:
      slug:
        description: "Optional blog slug. Leave empty to use the newest blog."
        required: false
        default: ""
        type: string
      format:
        description: "auto = use the post's YouTube Format setting (default Short)"
        required: false
        default: "auto"
        type: choice
        options: [auto, short, video]

concurrency:
  group: youtube-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select one blog
        id: select
        env:
          MANUAL_SLUG: ${{ inputs.slug }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          if [ -n "$MANUAL_SLUG" ]; then
            echo "slug=$MANUAL_SLUG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=AM "$BEFORE" "$SHA" -- 'content/blog/*.md' 2>/dev/null | head -n 1 || true)
          if [ -n "$changed" ]; then
            slug=$(basename "$changed" .md)
          else
            slug=$(ls -1t content/blog/*.md | head -n 1 | xargs -n1 basename | sed 's/\.md$//')
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Check whether this blog already has a YouTube item
        id: check
        env:
          SUPABASE_URL: https://yayljmqelmsmcsuhxqdj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLUG: ${{ steps.select.outputs.slug }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request
          base=os.environ["SUPABASE_URL"]; key=os.environ["SUPABASE_SERVICE_ROLE_KEY"]; slug=os.environ["SLUG"]
          params=urllib.parse.urlencode({"select":"id,status","item_type":"eq.youtube_video",
            "target_url":f"eq.https://glimerz.com/blog/{slug}/","limit":"1"})
          req=urllib.request.Request(f"{base}/rest/v1/content_items?{params}",headers={"apikey":key,"Authorization":f"Bearer {key}"})
          with urllib.request.urlopen(req) as r: data=r.read().decode()
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
            out.write(f"exists={'true' if data not in ('[]','') else 'false'}\n")
          print(data)
          PY

      - name: Set up Python
        if: steps.check.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-video.txt

      - name: Cache voice model and fonts
        if: steps.check.outputs.exists != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/glimerz-video
          key: glimerz-video-assets-v1

      - name: Install video tools
        if: steps.check.outputs.exists != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r tools/requirements-video.txt

      - name: Build video (free voice, local render)
        if: steps.check.outputs.exists != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python tools/video_builder.py --slug "${{ steps.select.outputs.slug }}" --format "${{ inputs.format || 'auto' }}"

      - name: Save video to B2 (private)
        if: steps.check.outputs.exists != 'true'
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          SLUG: ${{ steps.select.outputs.slug }}
        run: |
          thumb=$(ls build/video/*-thumbnail.jpg 2>/dev/null | head -n 1 || true)
          if [ -n "$thumb" ]; then
            python3 tools/b2.py upload --slug "$SLUG" --video "build/video/$SLUG.mp4" --thumb "$thumb" > build/b2.json
          else
            python3 tools/b2.py upload --slug "$SLUG" --video "build/video/$SLUG.mp4" > build/b2.json
          fi

      - name: Create exactly one YouTube review item
        if: steps.check.outputs.exists != 'true'
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          SUPABASE_URL: https://yayljmqelmsmcsuhxqdj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLUG: ${{ steps.select.outputs.slug }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          slug=os.environ["SLUG"]; base=os.environ["SUPABASE_URL"]; key=os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          m=json.load(open("build/video/manifest.json")); b2=json.load(open("build/b2.json"))
          payload=json.dumps({"item_type":"youtube_video","status":"pending_review","title":m["title"],
            "body":m["description"],"target_url":f"https://glimerz.com/blog/{slug}/",
            "media_urls":[u for u in (b2["video_url"], b2.get("thumb_url")) if u],
            "created_by":"video-builder"}).encode()
          req=urllib.request.Request(f"{base}/rest/v1/content_items",data=payload,method="POST",
            headers={"apikey":key,"Authorization":f"Bearer {key}","Content-Type":"application/json","Prefer":"return=representation"})
          try:
            with urllib.request.urlopen(req) as r: print("Review item created:", json.loads(r.read())[0]["id"])
          except urllib.error.HTTPError as e:
            if e.code == 409:
              import subprocess
              for n in (b2.get("video_name"), b2.get("thumb_name")):
                if n: subprocess.run(["python3","tools/b2.py","delete","--name",n])
              print("Duplicate prevented; no second YouTube item created.")
            else: raise
          PY

      - name: Save video as workflow artifact
        if: steps.check.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: glimerz-youtube-${{ steps.select.outputs.slug }}
          path: |
            build/video/${{ steps.select.outputs.slug }}.mp4
            build/video/*-thumbnail.jpg
            build/video/manifest.json
          retention-days: 7

      - name: Skip duplicate
        if: steps.check.outputs.exists == 'true'
        run: echo "YouTube item already exists for this blog. Nothing created."
