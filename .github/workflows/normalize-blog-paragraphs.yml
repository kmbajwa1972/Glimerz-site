name: Normalize blog paragraphs

on:
  push:
    paths:
      - '.github/workflows/normalize-blog-paragraphs.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Markdown article paragraphs
        run: |
          git checkout 7f8728f8ffcd27d54d025bac4f2d2a6ba0a20e75 -- content/blog
          python - <<'PY'
          from pathlib import Path
          import re

          BLOG = Path('content/blog')

          def sentence_count(text):
              return len(re.findall(r'[.!?](?:["\u2019\u201d\)\]]*)?(?=\s|$)', text))

          def is_structural(block):
              s = block.strip()
              if not s:
                  return True
              if re.match(r'^(#{1,6})\s+', s):
                  return True
              if re.match(r'^(?:[-*+]\s+|\d+[.)]\s+)', s):
                  return True
              if re.match(r'^>\s?', s):
                  return True
              if s.startswith('|') or '\n|' in s:
                  return True
              if s.startswith('```') or s.startswith('{{') or s.startswith('<'):
                  return True
              if s.startswith('!['):
                  return True
              if re.match(r'^\*Disclaimer:', s, re.I) or re.match(r'^Disclaimer:', s, re.I):
                  return True
              if re.match(r'^\*\*[^*]+\*\*:?\s+', s):
                  return True
              return False

          def normalize_body(body, title):
              lines = body.splitlines()
              while lines and not lines[0].strip():
                  lines.pop(0)
              if lines and re.fullmatch(r'#\s+(.+?)\s*', lines[0].strip()):
                  h1 = re.sub(r'^#\s+', '', lines[0].strip()).strip()
                  if h1.casefold() == title.strip().casefold():
                      lines = lines[1:]

              body = '\n'.join(lines).strip() + '\n'
              blocks = re.split(r'\n\s*\n', body)
              out = []
              i = 0

              while i < len(blocks):
                  block = blocks[i].strip()
                  if not block:
                      i += 1
                      continue
                  if is_structural(block):
                      out.append(block)
                      i += 1
                      continue

                  current = block
                  while i + 1 < len(blocks):
                      nxt = blocks[i + 1].strip()
                      if not nxt or is_structural(nxt):
                          break
                      cur_sent = sentence_count(current)
                      cur_len = len(current)
                      next_sent = sentence_count(nxt)
                      next_len = len(nxt)
                      should_join = (
                          cur_sent <= 1
                          or cur_len < 180
                          or (cur_sent == 2 and cur_len < 300 and next_sent <= 2 and next_len < 300)
                      )
                      if not should_join or cur_sent + next_sent > 5 or cur_len + next_len + 1 > 560:
                          break
                      current = current + ' ' + nxt
                      i += 1

                  out.append(current)
                  i += 1

              return '\n\n'.join(out).strip() + '\n'

          changed = []
          for path in sorted(BLOG.glob('*.md')):
              text = path.read_text(encoding='utf-8')
              marker = '\n---\n'
              end = text.find(marker, 4)
              if end == -1:
                  continue
              front = text[:end + len(marker)]
              body = text[end + len(marker):]
              m = re.search(r'^title:\s*["\']?(.+?)["\']?\s*$', front, re.M)
              title = m.group(1).strip().strip('"\'') if m else ''
              new_body = normalize_body(body, title)
              new_text = front.rstrip() + '\n' + new_body
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Normalized {len(changed)} articles.')
          for p in changed:
              print(p)
          PY

      - name: Commit normalized articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog
          if git diff --cached --quiet; then
            echo "No article changes needed."
            exit 0
          fi
          git commit -m "Normalize blog paragraph structure [skip ci]"
          git push
