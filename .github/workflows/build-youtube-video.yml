name: Glimerz YouTube Video Builder

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Blog slug without .md"
        required: true
        type: string
      format:
        description: "auto = use the post's YouTube Format setting (default Short)"
        required: false
        default: "auto"
        type: choice
        options: [auto, short, video]
      publish:
        description: "Upload video and create youtube_video review item"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-video.txt

      - name: Cache voice model and fonts
        uses: actions/cache@v4
        with:
          path: ~/.cache/glimerz-video
          key: glimerz-video-assets-v1

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r tools/requirements-video.txt

      - name: Zero-cost article and image preflight
        run: python tools/video_builder.py --slug "${{ inputs.slug }}" --format "${{ inputs.format }}" --preflight

      - name: Build video (free voice, local render)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/video_builder.py --slug "${{ inputs.slug }}" --format "${{ inputs.format }}"

      - name: Save video to B2 (private)
        if: ${{ inputs.publish }}
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          SLUG: ${{ inputs.slug }}
        run: |
          thumb=$(ls build/video/*-thumbnail.jpg 2>/dev/null | head -n 1 || true)
          if [ -n "$thumb" ]; then
            python3 tools/b2.py upload --slug "$SLUG" --video "build/video/$SLUG.mp4" --thumb "$thumb" > build/b2.json
          else
            python3 tools/b2.py upload --slug "$SLUG" --video "build/video/$SLUG.mp4" > build/b2.json
          fi

      - name: Create YouTube review item
        if: ${{ inputs.publish }}
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          SUPABASE_URL: https://yayljmqelmsmcsuhxqdj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLUG: ${{ inputs.slug }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          slug=os.environ["SLUG"]; base=os.environ["SUPABASE_URL"]; key=os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          m=json.load(open("build/video/manifest.json")); b2=json.load(open("build/b2.json"))
          payload=json.dumps({"item_type":"youtube_video","status":"pending_review","title":m["title"],
            "body":m["description"],"target_url":f"https://glimerz.com/blog/{slug}/",
            "media_urls":[u for u in (b2["video_url"], b2.get("thumb_url")) if u],
            "created_by":"video-builder"}).encode()
          req=urllib.request.Request(f"{base}/rest/v1/content_items",data=payload,method="POST",
            headers={"apikey":key,"Authorization":f"Bearer {key}","Content-Type":"application/json","Prefer":"return=representation"})
          try:
            with urllib.request.urlopen(req) as r: print("Review item created:", json.loads(r.read())[0]["id"])
          except urllib.error.HTTPError as e:
            if e.code == 409:
              import subprocess
              for n in (b2.get("video_name"), b2.get("thumb_name")):
                if n: subprocess.run(["python3","tools/b2.py","delete","--name",n])
              print("::notice::This post already has a YouTube item in the dashboard, so no second item was created. The new video file is still in the artifact below.")
            else:
              raise
          PY

      - name: Save video as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glimerz-youtube-video-${{ inputs.slug }}
          path: |
            build/video/${{ inputs.slug }}.mp4
            build/video/*-thumbnail.jpg
            build/video/manifest.json
          retention-days: 7
