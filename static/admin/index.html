<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Glimerz Admin Workspace</title>

  <!-- Points to the config file sitting in this exact same folder -->
  <link href="./config.yml" type="text/yaml" rel="cms-config-url" />
  <link rel="stylesheet" href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css" />
</head>
<body>
  <!-- Must be in body, not head - Decap CMS mounts into document.body on load -->
  <a id="ai-dashboard-btn" href="/admin/dashboard/" style="display:none; position:fixed; top:14px; right:16px; z-index:99999; background:#aa8453; color:#fff; padding:8px 16px; border-radius:4px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:0.85rem; text-decoration:none; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    AI Manager Dashboard →
  </a>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Only reveal the dashboard button once Decap CMS confirms the user is actually logged in.
    // Without this, the button was showing on the pre-login screen too.
    if (window.CMS && typeof window.CMS.registerEventListener === "function") {
      window.CMS.registerEventListener({
        name: "login",
        handler: function () {
          var btn = document.getElementById("ai-dashboard-btn");
          if (btn) btn.style.display = "block";
        },
      });
    }
  </script>
</body>
</html>
