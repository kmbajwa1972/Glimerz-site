<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Glimerz Admin Workspace</title>

  <!-- Points to the config file sitting in this exact same folder -->
  <link href="./config.yml" type="text/yaml" rel="cms-config-url" />
  <link rel="stylesheet" href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css" />
</head>
<body>
  <!-- Must be in body, not head - Decap CMS mounts into document.body on load -->
  <a id="ai-dashboard-btn" href="/admin/dashboard/" style="display:none; position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:99999; background:#aa8453; color:#fff; padding:8px 20px; border-radius:4px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:0.85rem; text-decoration:none; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    AI Manager Dashboard →
  </a>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Decap CMS re-renders document.body with React on mount, which can wipe out
    // any plain HTML sitting there beforehand - including our button. So instead
    // of hoping the original element survives, we keep a reference to it and
    // re-insert it into the live DOM at the moment we actually want to show it.
    var btn = document.getElementById("ai-dashboard-btn");
    if (btn && btn.parentNode) btn.parentNode.removeChild(btn);

    function showDashboardBtn() {
      if (!btn) return;
      btn.style.display = "block";
      if (!document.body.contains(btn)) {
        document.body.appendChild(btn);
      }
    }

    if (window.CMS && typeof window.CMS.registerEventListener === "function") {
      window.CMS.registerEventListener({ name: "login", handler: showDashboardBtn });
    }

    var checks = 0;
    var poll = setInterval(function () {
      checks++;
      var pastLogin = /^#\/(collections|search|workflow)/.test(window.location.hash);
      if (pastLogin) {
        showDashboardBtn();
      }
      if (checks > 60) clearInterval(poll); // stop after ~30 seconds either way
    }, 500);
  </script>
</body>
</html>
